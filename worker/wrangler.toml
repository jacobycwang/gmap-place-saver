# The gmap MCP server, remote: POST /mcp (Streamable HTTP). See README.md.
name = "gmap-place-saver"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering (Browser Run). Workers Free: 10 browser-minutes a
# day; Workers Paid ($5/month) for anything beyond a trial.
browser = { binding = "BROWSER" }

# Keys: storage-state (Playwright storageState JSON), regions (the region-lists
# JSON), session-log (results of the scheduled session check).
# Create it with `npx wrangler kv namespace create GMAP_KV` and paste the id.
[[kv_namespaces]]
binding = "GMAP_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The src/ modules import `playwright` for the local persistent-profile launch,
# which the Worker never calls. Point it at a stub so the Node package is not
# bundled.
[alias]
"playwright" = "./src/playwright-stub.js"

# Opens Google Maps with the stored session every 6 hours and records whether
# Google still accepts it: the "does the cookie survive a datacenter IP" test.
# About 15 s of browser time a run, ~1 minute a day.
[triggers]
crons = ["17 */6 * * *"]

[observability]
enabled = true

# Secret, set with `npx wrangler secret put API_TOKEN`: every request needs
# `Authorization: Bearer <API_TOKEN>`.
